[project]
name = "mbot2-mcp"
version = "0.1.0"
description = "Small MCP server to control mBot2 / CyberPi robots over serial (USB or Bluetooth-serial) for opencode."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0,<2",
  "pyserial>=3.5",
]

[project.scripts]
mbot2-mcp = "mbot2_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbot2_mcp"]

[tool.hatch.build]
artifacts = ["src/mbot2_mcp/*"]
