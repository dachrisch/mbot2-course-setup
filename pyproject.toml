[project]
name = "cyberpi-upload-mcp"
version = "0.1.0"
description = "Upload-only MCP server for the CyberPi (mBot2 brain) over USB serial — no browser, no mLink."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0,<2",
  "pyserial>=3.5",
]

[project.scripts]
cyberpi-upload = "cyberpi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberpi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
